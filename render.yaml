previewsEnabled: true
previewsExpireAfterDays: 3

services:
  # NestJS API — Docker container (persistent process for SSE + cache)
  - type: web
    name: voxpopuli-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    previews:
      generation: automatic
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        previewValue: onrender.com
      - fromGroup: voxpopuli-secrets

  # Angular frontend — static site via Render CDN
  - type: web
    name: voxpopuli-web
    runtime: static
    buildCommand: bash scripts/set-api-url.sh && corepack enable && pnpm install --frozen-lockfile && npx nx build web --configuration=production
    staticPublishPath: dist/apps/web/browser
    previews:
      generation: automatic
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        fromService:
          name: voxpopuli-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

envVarGroups:
  - name: voxpopuli-secrets
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MISTRAL_TTS_MODEL
        value: voxtral-mini-tts-latest
      - key: MISTRAL_TTS_VOICE
        value: en_paul_neutral
      - key: SENTRY_DSN
        sync: false
      # Optional: Render Key Value internal URL (redis://red-...:6379) so query results
      # survive deploys. Not provisioned here; see docs/adr/011-persistent-query-store.md.
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        value: https://voxpopuli-web-embx.onrender.com,https://voxpopuli-web-1o3v.onrender.com
